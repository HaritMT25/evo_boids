<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evo_boids — wasm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230F1E19'/%3E%3Ccircle cx='10' cy='8' r='3' fill='%2397C632'/%3E%3Ccircle cx='6' cy='8' r='2' fill='%2397C632' opacity='.7'/%3E%3Ccircle cx='3' cy='8' r='1.3' fill='%2397C632' opacity='.45'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a120e; color: #c8c8c8; font: 13px/1.5 monospace; height: 100%; }
  /* Full-viewport stage; all controls live in the slide-in drawer. */
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 6px;
    overflow: hidden;
  }
  #stage {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    /* replaced element with intrinsic size: both max constraints apply and the
     * aspect is preserved, even after a checkpoint changes the world size */
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    background: #0F1E19;
    border: 1px solid #1e3a2e;
  }
  /* no double-tap zoom on what gets tapped repeatedly (pinch zoom still works) */
  canvas, button, label, summary, input, select {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  /* hamburger: fixed top-right, above the drawer */
  #menubtn {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 30;
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    background: rgba(26,58,42,0.8);
    color: #cfe8d8;
    border: 1px solid #3a6a4e;
    border-radius: 4px;
    cursor: pointer;
  }
  #menubtn:hover, #dashbtn:hover { background: rgba(35,80,56,0.95); }
  /* dashboards: beside the hamburger (web/dashboard.js) */
  #dashbtn {
    position: fixed;
    top: 10px;
    right: 54px;
    z-index: 30;
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 17px;
    line-height: 1;
    background: rgba(26,58,42,0.8);
    border: 1px solid #3a6a4e;
    border-radius: 4px;
    cursor: pointer;
  }
  /* shown on compact screens when the world no longer matches the screen's
   * shape (the phone was rotated): restarts with a fitted world */
  #fitbtn {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 25;
    min-height: 44px;
    background: rgba(26,58,42,0.9);
  }
  #fitbtn[hidden] { display: none; }
  /* out of the docked inspector's way (and of the status line it moves);
   * closing the inspector brings the button back */
  body[data-dock] #fitbtn { display: none; }
  /* right-side drawer */
  #drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100dvh;
    width: 360px;
    max-width: 90vw;
    z-index: 20;
    background: #0d1813;
    border-left: 1px solid #1e3a2e;
    padding: 12px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #drawer.open { transform: translateX(0); }
  #drawer h1 {
    font-size: 14px;
    font-weight: normal;
    color: #7ea08c;
    letter-spacing: 1px;
    margin-right: 100px; /* keep clear of the 📊 and ✕ buttons */
  }
  #bar, #controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  label { display: inline-flex; align-items: center; gap: 4px; color: #8fa89a; }
  /* parameter rows: name left, control in one right-aligned column down the drawer */
  #controls fieldset { flex-direction: column; align-items: stretch; gap: 4px; }
  #controls fieldset label, #advgrid label {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 8px;
  }
  #controls fieldset input[type="checkbox"], #advgrid input[type="checkbox"] { justify-self: end; }
  /* hover-info affordance on parameter names */
  .lt { justify-self: start; border-bottom: 1px dotted #3a5a48; cursor: help; }
  input[type="number"], select {
    width: 6.5em;
    background: #10201a;
    color: #d5e5da;
    border: 1px solid #2a4a3a;
    border-radius: 3px;
    padding: 3px 5px;
    font: inherit;
  }
  input[type="checkbox"] { accent-color: #4a8a64; }
  fieldset {
    border: 1px solid #1e3a2e;
    border-radius: 4px;
    padding: 3px 10px 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    min-width: 0;
  }
  legend {
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 1px;
    color: #6f927e;
    padding: 0 5px;
  }
  button {
    background: #1a3a2a;
    color: #cfe8d8;
    border: 1px solid #3a6a4e;
    border-radius: 3px;
    padding: 4px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #235038; }
  /* interlocked (turbo) and in-transition buttons */
  button.locked, button:disabled { opacity: .45; cursor: default; }
  button.locked:hover, button:disabled:hover { background: #1a3a2a; }
  #slower, #faster { padding: 4px 10px; }
  #speedlabel { color: #8fa89a; min-width: 7.5em; text-align: center; }
  .row { display: flex; align-items: center; gap: 10px; }
  #err { color: #e05a5a; min-height: 1em; }
  /* Borderless container so its section fieldsets sit at the same inset as
   * the basic groups — one globally aligned control column down the drawer. */
  #adv {
    width: 100%;
    padding: 0;
  }
  #adv summary { cursor: pointer; color: #7ea08c; user-select: none; padding: 4px 0; }
  #advgrid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 0;
  }
  #advgrid fieldset { display: block; padding: 1px 10px 6px; }
  #advgrid .agrid {
    display: grid;
    grid-template-columns: 1fr; /* one knob per row in the drawer */
    gap: 4px;
  }
  #advgrid input[type="number"], #advgrid select { width: 6.5em; }
  /* shared hover tooltip (element created by renderer.js) */
  #tooltip {
    display: none;
    position: fixed;
    z-index: 40;
    max-width: 280px;
    background: rgba(10,24,17,0.94);
    border: 1px solid #2a4a3a;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.45;
    pointer-events: none;
  }
  #tooltip .tipd { color: #cfe0d5; }
  #tooltip .tipt { color: #8fb89f; margin-top: 2px; }
  /* live status line over the canvas: fixed px size, so it stays readable
   * when the 1920-wide canvas is scaled down (small windows, iframes) */
  #status {
    position: fixed;
    left: 12px;
    bottom: 10px;
    right: 56px;
    z-index: 10;
    font-size: 12px;
    color: #cfe0d5;
    text-shadow: 0 0 3px #000, 0 0 2px #000;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Wide screens: the open menu sits beside the world instead of over it,
   * so a change can be watched (renderer.js setDrawer toggles the class). */
  body { transition: padding-right 0.2s ease; }
  @media (min-width: 960px) {
    body.menu-open { padding-right: 366px; }
    body.menu-open #status { right: 378px; }
  }
  /* settings that need another one switched on (renderer.js updateNeeds) */
  label.inert { opacity: 0.5; }
  .needs { grid-column: 1 / -1; font-size: 10px; color: #8fb89f; }
  .needs:empty { display: none; }
  /* settings changed since the last restart */
  #restart.pending { background: #2f6b4a; border-color: #9fd3b0; color: #eaf6ee; font-weight: bold; }
  /* narrow (portrait phone) screens: wrap instead of cutting the line off */
  @media (max-width: 600px) {
    #status { white-space: normal; line-height: 1.5; right: 12px; }
  }
  /* Compact-screen inspector (renderer.js: compactMQ). The desktop one is
   * drawn on the canvas in world px and shrinks with it; this one is laid out
   * in CSS px, docked to the screen edge away from the selected fish. */
  #inspector {
    display: none;
    position: fixed;
    z-index: 15;
    flex-direction: column;
    background: rgba(10,22,30,0.88);
    border: 0 solid rgba(90,140,150,0.86);
    color: #dcebf0;
    font-size: 12px;
  }
  #inspector.top, #inspector.bottom {
    display: flex;
    left: 0;
    right: 0;
    max-width: 560px;
    margin: 0 auto;
    height: min(46vh, 380px);   /* fallback where dvh is unknown */
    height: min(46dvh, 380px);
  }
  #inspector.top { top: 0; border-bottom-width: 1px; }
  #inspector.bottom { bottom: 0; border-top-width: 1px; }
  #inspector.left, #inspector.right {
    display: flex;
    top: 0;
    bottom: 0;
    width: min(320px, 46vw);
  }
  #inspector.left { left: 0; border-right-width: 1px; }
  #inspector.right { right: 0; border-left-width: 1px; }
  #inspector .ihead {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding-left: 10px;
  }
  /* keep the close button clear of the fixed 📊 and ☰ buttons */
  #inspector.top .ihead { padding-right: 112px; }
  #inspector.right .ihead { padding-right: 112px; min-height: 56px; }
  #inspector .itext { flex: 1; min-width: 0; line-height: 1.4; }
  #isub { color: #becdd2; font-size: 11px; }
  #iclose {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    background: none;
    font-size: 18px;
  }
  #inspector .inet { position: relative; flex: 1 1 auto; min-height: 0; }
  #inspector .inet canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    border: 0;
    background: none;
  }
  /* the status line steps out of the docked inspector's way */
  body[data-dock="bottom"] #status { bottom: auto; top: 12px; right: 120px; }
  body[data-dock="left"] #status { left: calc(min(320px, 46vw) + 12px); }
  body[data-dock="right"] #status { right: calc(min(320px, 46vw) + 12px); }
  @media (pointer: coarse) {
    /* 16px stops iOS zooming the page when an input gets focus */
    input[type="number"], select { font-size: 16px; min-height: 40px; }
    /* touch targets of at least 44 px */
    button, summary { min-height: 44px; }
    #slower, #faster { min-width: 44px; }
    #menubtn { width: 44px; height: 44px; font-size: 20px; }
    #dashbtn { width: 44px; height: 44px; right: 62px; font-size: 20px; }
    input[type="checkbox"] { width: 24px; height: 24px; }
    #controls fieldset label, #advgrid label { min-height: 44px; }
    /* parameter names are tapped for their explanation (renderer.js attachTip) */
    .lt::after { content: " \24D8"; color: #6f927e; }
  }
  #randombtn { font-weight: bold; }
  #randnote { font-size: 11px; color: #9fd3b0; line-height: 1.45; }
  #randnote:empty { display: none; }
  /* First-visit guide (web/guide.js). The shade is a huge shadow around the
   * spotlight and never takes clicks, so the page stays usable mid-tour. */
  #guide { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  #guide .spot {
    position: fixed;
    border-radius: 8px;
    box-shadow: 0 0 0 200vmax rgba(0,0,0,0.55);
    outline: 2px solid #9fd3b0;
    outline-offset: 0;
    transition: left .2s ease, top .2s ease, width .2s ease, height .2s ease;
  }
  #guide .spot.none { outline: 0; }
  #guide .card {
    position: fixed;
    pointer-events: auto;
    width: min(340px, calc(100vw - 24px));
    background: #0f1f18;
    border: 1px solid #3a6a4e;
    border-radius: 8px;
    padding: 14px 16px 12px;
    color: #d5e5da;
    line-height: 1.5;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #guide h2 { font-size: 14px; font-weight: bold; color: #9fd3b0; margin-bottom: 6px; }
  #guide p { margin-bottom: 4px; }
  #guide kbd {
    border: 1px solid #3a6a4e;
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 4px;
    background: #10201a;
    font: inherit;
  }
  #guide .nav { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  #guide .count { flex: 1; color: #6f927e; font-size: 11px; }
  #guide .skip { background: none; border: 0; color: #8fa89a; text-decoration: underline; padding: 4px 6px; }
  #guide .next { font-weight: bold; }
  #modeline { color: #6f927e; font-size: 11px; }
  #credit { margin-top: auto; padding-top: 8px; font-size: 11px; color: #5f7d6c; }
  #credit a { color: #7ea08c; }
  .livetag {
    margin-left: 6px;
    font-size: 9px;
    color: #9fd3b0;
    border: 1px solid #2f5a40;
    border-radius: 3px;
    padding: 0 3px;
    vertical-align: 1px;
  }
  /* ---- dashboards (web/dashboard.js, charts in web/charts.js) ---- */
  #dash {
    position: fixed;
    inset: 0;
    z-index: 35;
    display: flex;
    flex-direction: column;
    background: #0a120e;
    color: #dfe9e3;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #dash[hidden] { display: none; }
  #dash .dhead { display: flex; align-items: center; gap: 10px 14px; padding: 10px 16px 0; flex-wrap: wrap; }
  #dash h2 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  #dtabs { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #dtabs::-webkit-scrollbar { display: none; }
  #dash button { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #dtabs button {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: #a9bdb1;
    padding: 8px 10px;
    white-space: nowrap;
  }
  #dtabs button:hover { background: #12231b; }
  #dtabs button[aria-selected="true"] { color: #eaf6ee; border-bottom-color: #3987e5; }
  #dash .dtools { display: flex; gap: 6px; margin-left: auto; }
  #dash .dtools button { padding: 5px 10px; }
  #dclose { width: 36px; padding: 0 !important; font-size: 16px !important; }
  #dnote { padding: 6px 16px 8px; font-size: 12px; color: #7f958a; border-bottom: 1px solid #1d2c25; }
  #dgrid {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 16px 28px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 14px;
    align-content: start;
  }
  .dcard { background: #101c17; border: 1px solid #1d2c25; border-radius: 8px; padding: 12px 14px 10px; min-width: 0; }
  .dcard.wide { grid-column: 1 / -1; }
  .dcard h3 { font-size: 13px; font-weight: 600; }
  .dcard .cap { font-size: 12px; color: #a9bdb1; line-height: 1.45; margin: 3px 0 8px; }
  .dcard .cbox { position: relative; height: 210px; }
  .dcard .cbox.tall { height: 340px; }
  .dcard .cbox.huge { height: min(70vh, 640px); }
  .dcard .cbox.xtall { height: 560px; }
  .dcard .cbox canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    border: 0;
    background: none;
    touch-action: pan-y;
  }
  .dcard .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 11px; color: #a9bdb1; }
  .dcard .legend:empty { display: none; }
  .legend .li { display: inline-flex; align-items: center; gap: 5px; }
  .legend i, .charttip i { display: inline-block; flex: none; width: 12px; height: 10px; border-radius: 2px; }
  .legend b { color: #dfe9e3; font-weight: 600; }
  .legend .scale { display: inline-block; width: 140px; height: 10px; border-radius: 2px; }
  .dcard .cnote { font-size: 11px; color: #7f958a; margin-top: 4px; }
  .dcard .cnote:empty { display: none; }
  .dcard.off .cbox, .dcard.off .legend { display: none; }
  .dcard.off .cnote { color: #a9bdb1; font-size: 12px; }
  .charttip {
    position: fixed;
    z-index: 60;
    display: none;
    pointer-events: none;
    min-width: 130px;
    max-width: 300px;
    background: rgba(8,16,12,0.96);
    border: 1px solid #2a4a3a;
    border-radius: 6px;
    padding: 6px 9px;
    font: 12px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #dfe9e3;
  }
  .charttip .th { color: #a9bdb1; margin-bottom: 2px; }
  .charttip .tr { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .charttip .tr span { flex: 1; color: #a9bdb1; }
  .charttip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) {
    #dash .dhead { padding: 8px 10px 0; }
    #dtabs { order: 3; flex-basis: 100%; }
    #dnote { padding: 4px 10px 6px; }
    #dgrid { grid-template-columns: 1fr; padding: 10px 10px 24px; gap: 10px; }
    .dcard { padding: 10px 10px 8px; }
    .dcard .cbox { height: 190px; }
    .dcard .cbox.tall { height: 300px; }
    .dcard .cbox.xtall { height: 540px; }
  }
  @media (pointer: coarse) {
    #dclose { width: 44px; }
    #dtabs button { min-height: 44px; }
  }
  #benchout {
    position: fixed;
    left: 12px;
    top: 12px;
    z-index: 15;
    max-width: calc(100vw - 80px);
    overflow: auto;
    background: rgba(8,18,13,0.92);
    border: 1px solid #2a4a3a;
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 12px;
    color: #d5e5da;
    white-space: pre;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="canvas" width="1920" height="1080"></canvas></div>
  <div id="status" aria-live="off">loading…</div>
  <div id="inspector">
    <div class="ihead">
      <div class="itext"><div id="ititle"></div><div id="isub"></div></div>
      <button id="iclose" aria-label="close the inspector">&#10005;</button>
    </div>
    <div class="inet"><canvas id="inetc"></canvas></div>
  </div>
  <button id="fitbtn" hidden>&#10530; fit to screen (restarts)</button>
  <button id="dashbtn" aria-label="open the dashboards" aria-expanded="false" title="dashboards: charts of this run">&#128202;</button>
  <button id="menubtn" aria-label="open controls">&#9776;</button>
  <div id="dash" role="dialog" aria-label="dashboards" hidden>
    <div class="dhead">
      <h2>&#128202; Dashboards</h2>
      <nav id="dtabs" role="tablist"></nav>
      <div class="dtools">
        <button id="dcsv" title="every recorded sample, as a spreadsheet">&#10515; CSV</button>
        <button id="dtree" title="the family tree in Newick format, for tree viewers such as FigTree or iTOL">&#10515; Tree</button>
        <button id="dclose" aria-label="close the dashboards">&#10005;</button>
      </div>
    </div>
    <p id="dnote"></p>
    <div id="dgrid"></div>
  </div>
  <div id="drawer">
    <h1>evo_boids — wasm</h1>
    <div class="row" id="quick">
      <button id="randombtn" title="draw a setup from ranges that worked in our experiments, and restart">&#127922; Randomize</button>
      <button id="guidebtn" title="replay the first-visit tour">? Guide</button>
    </div>
    <p id="randnote"></p>
    <div id="bar">
      <fieldset>
        <legend>playback</legend>
        <button id="pausebtn">Pause</button>
        <button id="slower">&minus;</button>
        <span id="speedlabel">speed 1x</span>
        <button id="faster">+</button>
        <button id="turbobtn" title="run headless in a worker at full speed — no rendering, keeps running in background tabs; toggling is bit-exact">Turbo</button>
        <label><span class="lt">hold 60 fps</span><input id="governor" type="checkbox" checked></label>
        <span id="modeline"></span>
      </fieldset>
      <fieldset>
        <legend>checkpoint</legend>
        <button id="savecp">Save checkpoint</button>
        <button id="loadcp">Load checkpoint</button>
        <input id="cpfile" type="file" accept=".json" hidden>
      </fieldset>
    </div>
    <div id="controls">
      <fieldset>
        <legend>world</legend>
        <label><span class="lt">seed</span><input id="seed" type="number" value="42" min="0" step="1"></label>
        <label><span class="lt">population</span><input id="population" type="number" value="300" min="1" step="1"></label>
        <label><span class="lt">toroidal</span><input id="toroidal" type="checkbox"></label>
        <label><span class="lt">body model</span><input id="bodyModel" type="checkbox"></label>
      </fieldset>
      <fieldset>
        <legend>predators</legend>
        <label><span class="lt">predators</span><input id="predators" type="number" value="0" min="0" step="1"></label>
        <label><span class="lt">predator economy</span><input id="predatorEconomy" type="checkbox"></label>
      </fieldset>
      <fieldset>
        <legend>environment</legend>
        <label><span class="lt">food patches</span><input id="foodPatches" type="number" value="0" min="0" step="1"></label>
        <label><span class="lt">current strength</span><input id="currentStrength" type="number" value="0" min="0" step="1"></label>
      </fieldset>
      <div class="row">
        <button id="restart">Restart</button>
        <span id="err"></span>
      </div>
    </div>
    <details id="adv">
      <summary>advanced settings</summary>
      <div id="advgrid"></div>
