<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evo_boids — wasm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a120e; color: #c8c8c8; font: 13px/1.5 monospace; height: 100%; }
  /* Full-viewport stage; all controls live in the slide-in drawer. */
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 6px;
    overflow: hidden;
  }
  #stage {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    /* replaced element with intrinsic size: both max constraints apply and the
     * aspect is preserved, even after a checkpoint changes the world size */
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    background: #0F1E19;
    border: 1px solid #1e3a2e;
  }
  /* hamburger: fixed top-right, above the drawer */
  #menubtn {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 30;
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    background: rgba(26,58,42,0.8);
    color: #cfe8d8;
    border: 1px solid #3a6a4e;
    border-radius: 4px;
    cursor: pointer;
  }
  #menubtn:hover { background: rgba(35,80,56,0.95); }
  /* right-side drawer */
  #drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100dvh;
    width: 360px;
    max-width: 90vw;
    z-index: 20;
    background: #0d1813;
    border-left: 1px solid #1e3a2e;
    padding: 12px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #drawer.open { transform: translateX(0); }
  #drawer h1 {
    font-size: 14px;
    font-weight: normal;
    color: #7ea08c;
    letter-spacing: 1px;
    margin-right: 40px; /* keep clear of the ✕ button */
  }
  #bar, #controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  /* tight text-to-input gap everywhere */
  label { display: inline-flex; align-items: center; justify-content: flex-start; gap: 4px; color: #8fa89a; }
  input[type="number"], select {
    width: 6.5em;
    background: #10201a;
    color: #d5e5da;
    border: 1px solid #2a4a3a;
    border-radius: 3px;
    padding: 3px 5px;
    font: inherit;
  }
  input[type="checkbox"] { accent-color: #4a8a64; }
  fieldset {
    border: 1px solid #1e3a2e;
    border-radius: 4px;
    padding: 3px 10px 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    min-width: 0;
  }
  legend {
    font-size: 10px;
    text-transform: lowercase;
    letter-spacing: 1px;
    color: #6f927e;
    padding: 0 5px;
  }
  button {
    background: #1a3a2a;
    color: #cfe8d8;
    border: 1px solid #3a6a4e;
    border-radius: 3px;
    padding: 4px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #235038; }
  #slower, #faster { padding: 4px 10px; }
  #speedlabel { color: #8fa89a; min-width: 7.5em; text-align: center; }
  .row { display: flex; align-items: center; gap: 10px; }
  #err { color: #e05a5a; min-height: 1em; }
  #adv {
    width: 100%;
    background: #0d1813;
    border: 1px solid #1e3a2e;
    border-radius: 4px;
    padding: 8px 12px;
  }
  #adv summary { cursor: pointer; color: #7ea08c; user-select: none; }
  #advgrid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 8px 0;
  }
  #advgrid fieldset { display: block; padding: 1px 10px 6px; }
  #advgrid .agrid {
    display: grid;
    grid-template-columns: 1fr; /* one knob per row in the drawer */
    gap: 4px;
  }
  #advgrid input[type="number"], #advgrid select { width: 5em; }
</style>
</head>
<body>
  <div id="stage"><canvas id="canvas" width="1920" height="1080"></canvas></div>
  <button id="menubtn" aria-label="open controls">&#9776;</button>
  <div id="drawer">
    <h1>evo_boids — wasm</h1>
    <div id="bar">
      <fieldset>
        <legend>playback</legend>
        <button id="pausebtn">Pause</button>
        <button id="slower">&minus;</button>
        <span id="speedlabel">speed 1x</span>
        <button id="faster">+</button>
      </fieldset>
      <fieldset>
        <legend>checkpoint</legend>
        <button id="savecp">Save checkpoint</button>
        <button id="loadcp">Load checkpoint</button>
        <input id="cpfile" type="file" accept=".json" hidden>
      </fieldset>
    </div>
    <div id="controls">
      <fieldset>
        <legend>world</legend>
        <label>seed <input id="seed" type="number" value="42" min="0" step="1"></label>
        <label>population <input id="population" type="number" value="300" min="1" step="1"></label>
      </fieldset>
      <fieldset>
        <legend>predators</legend>
        <label>predators <input id="predators" type="number" value="0" min="0" step="1"></label>
        <label><input id="predatorEconomy" type="checkbox"> predator economy</label>
      </fieldset>
      <fieldset>
        <legend>environment</legend>
        <label>food patches <input id="foodPatches" type="number" value="0" min="0" step="1"></label>
        <label>current strength <input id="currentStrength" type="number" value="0" min="0" step="1"></label>
      </fieldset>
      <div class="row">
        <button id="restart">Restart</button>
        <span id="err"></span>
      </div>
    </div>
    <details id="adv">
      <summary>advanced settings</summary>
      <div id="advgrid"></div>
      <button id="advreset">reset to defaults</button>
    </details>
  </div>
  <script src="evo_boids.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
