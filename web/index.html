<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evo_boids — wasm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a120e; color: #c8c8c8; font: 13px/1.5 monospace; height: 100%; }
  /* One-viewport layout: the stage (canvas) takes whatever height is left after
   * the controls, and the canvas letterboxes inside it — so on any screen the
   * controls stay visible without scrolling. Opening the advanced panel shrinks
   * the stage rather than pushing content off-screen; only if the stage hits
   * its minimum does the page scroll. */
  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 12px;
    gap: 8px;
    overflow-y: auto;
  }
  h1 { font-size: 14px; font-weight: normal; color: #7ea08c; letter-spacing: 1px; flex: none; }
  #stage {
    flex: 1 1 auto;
    min-height: 220px;   /* below this the page scrolls instead of shrinking further */
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    /* replaced element with intrinsic size: both max constraints apply and the
     * aspect is preserved, even after a checkpoint changes the world size */
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    background: #0F1E19;
    border: 1px solid #1e3a2e;
  }
  @media (max-height: 640px) {
    h1 { display: none; }  /* reclaim vertical space on short screens */
  }
  #bar, #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 14px;
    width: 100%;
    max-width: 1920px;
    flex: none;
  }
  label { display: inline-flex; align-items: center; gap: 5px; color: #8fa89a; }
  input[type="number"], select {
    width: 6.5em;
    background: #10201a;
    color: #d5e5da;
    border: 1px solid #2a4a3a;
    border-radius: 3px;
    padding: 3px 5px;
    font: inherit;
  }
  input[type="checkbox"] { accent-color: #4a8a64; }
  button {
    background: #1a3a2a;
    color: #cfe8d8;
    border: 1px solid #3a6a4e;
    border-radius: 3px;
    padding: 4px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #235038; }
  #slower, #faster { padding: 4px 10px; }
  #speedlabel { color: #8fa89a; min-width: 7.5em; text-align: center; }
  #err { color: #e05a5a; min-height: 1em; }
  #adv {
    width: 100%;
    max-width: 1920px;
    background: #0d1813;
    border: 1px solid #1e3a2e;
    border-radius: 4px;
    padding: 8px 12px;
    flex: none;
    max-height: 45dvh;   /* the panel itself scrolls before it starves the stage */
    overflow-y: auto;
  }
  #adv summary { cursor: pointer; color: #7ea08c; user-select: none; }
  #advgrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 6px 18px;
    margin: 10px 0;
  }
  #advgrid label { justify-content: space-between; }
  #advgrid label:has(input[type="checkbox"]) { justify-content: flex-start; }
  #advgrid input[type="number"], #advgrid select { width: 5em; }
</style>
</head>
<body>
  <h1>evo_boids — wasm</h1>
  <div id="stage"><canvas id="canvas" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="pausebtn">Pause</button>
    <button id="slower">&minus;</button>
    <span id="speedlabel">speed 1x</span>
    <button id="faster">+</button>
    <button id="savecp">Save checkpoint</button>
    <button id="loadcp">Load checkpoint</button>
    <input id="cpfile" type="file" accept=".json" hidden>
  </div>
  <div id="controls">
    <label>seed <input id="seed" type="number" value="42" min="0" step="1"></label>
    <label>population <input id="population" type="number" value="300" min="1" step="1"></label>
    <label>predators <input id="predators" type="number" value="0" min="0" step="1"></label>
    <label>food patches <input id="foodPatches" type="number" value="0" min="0" step="1"></label>
    <label>current strength <input id="currentStrength" type="number" value="0" min="0" step="1"></label>
    <label><input id="predatorEconomy" type="checkbox"> predator economy</label>
    <button id="restart">Restart</button>
    <span id="err"></span>
  </div>
  <details id="adv">
    <summary>advanced settings</summary>
    <div id="advgrid"></div>
    <button id="advreset">reset to defaults</button>
  </details>
  <script src="evo_boids.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
